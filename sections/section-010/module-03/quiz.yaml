# Knowledge check for module 03 of section 010. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
course_id: ATS112
exam_code: OPENBAO
status: draft
provenance: Original practice material written for this course; not official exam questions.
id: ats112-010-m03
scope:
  type: module
  id: module-03
  title: "Run A Three-Node OpenBao Cluster"
placement:
  position: after
  reading: sections/section-010/module-03/course-05-summary.md
questions:
- id: ats112-010-m03-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Choose the node ID setting"
  source_readings:
  - sections/section-010/module-03/course-01-helm-values-for-a-raft-cluster.md
  prompt: "Which Helm value gives each Raft pod a different node ID taken from its pod name?"
  options:
  - id: a
    text: "`server.ha.raft.setNodeId: true`"
    explanation: "Correct. The nodes are named `openbao-0`, `openbao-1` and `openbao-2`."
  - id: b
    text: "`server.ha.replicas: true`"
    explanation: "Not correct. The replicas value is a number of pods."
  - id: c
    text: "`server.dataStorage.nodeId`"
    explanation: "Not correct. That value does not exist."
  - id: d
    text: "`ui.enabled: true`"
    explanation: "Not correct. It only turns the web interface on."
  correct_option: a
  explanation: "Correct. The nodes are named `openbao-0`, `openbao-1` and `openbao-2`."
- id: ats112-010-m03-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain retry_join"
  source_readings:
  - sections/section-010/module-03/course-01-helm-values-for-a-raft-cluster.md
  prompt: "What does a `retry_join` block in the `storage \"raft\"` configuration do?"
  options:
  - id: a
    text: "It retries failed writes to disk."
    explanation: "Not correct. It is about cluster membership."
  - id: b
    text: "It retries the unseal operation."
    explanation: "Not correct. Unsealing is separate."
  - id: c
    text: "It copies a snapshot from a node."
    explanation: "Not correct. A snapshot is a separate operation."
  - id: d
    text: "It names a node that the starting node tries to join, until one answers."
    explanation: "Correct. The nodes are listed so any of them can be the first."
  correct_option: d
  explanation: "Correct. The nodes are listed so any of them can be the first."
- id: ats112-010-m03-q03
  type: single_choice
  difficulty: beginner
  learning_objective: "Initialize the right number of nodes"
  source_readings:
  - sections/section-010/module-03/course-01-helm-values-for-a-raft-cluster.md
  prompt: "On how many nodes do you run `bao operator init` for a new three-node cluster?"
  options:
  - id: a
    text: "Three, one on each node."
    explanation: "Not correct. Each init would create a separate cluster."
  - id: b
    text: "Two."
    explanation: "Not correct. Initialization happens once."
  - id: c
    text: "One."
    explanation: "Correct. The other nodes join the cluster and receive the keys from it."
  - id: d
    text: "None. The Helm chart does it."
    explanation: "Not correct. You run the command yourself."
  correct_option: c
  explanation: "Correct. The other nodes join the cluster and receive the keys from it."
- id: ats112-010-m03-q04
  type: single_choice
  difficulty: beginner
  learning_objective: "Know that each node is unsealed on its own"
  source_readings:
  - sections/section-010/module-03/course-02-joining-and-unsealing-the-nodes.md
  prompt: "A second node joined the cluster. What must you still do before it counts toward the quorum?"
  options:
  - id: a
    text: "Initialize it."
    explanation: "Not correct. It receives the cluster keys when it joins."
  - id: b
    text: "Unseal it."
    explanation: "Correct. Each node holds the key only in its own memory."
  - id: c
    text: "Nothing. A joined node is always unsealed."
    explanation: "Not correct. A joined node starts sealed."
  - id: d
    text: "Restart the leader."
    explanation: "Not correct. This causes an election and is not needed."
  correct_option: b
  explanation: "Correct. Each node holds the key only in its own memory."
- id: ats112-010-m03-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: "Read the standby role"
  source_readings:
  - sections/section-010/module-03/course-02-joining-and-unsealing-the-nodes.md
  prompt: "Which output of `bao status` shows that a node is an unsealed standby?"
  options:
  - id: a
    text: "`HA Mode` is `standby`."
    explanation: "Correct. The active node shows `active`."
  - id: b
    text: "`Sealed` is `true`."
    explanation: "Not correct. That means the node is sealed."
  - id: c
    text: "`HA Enabled` is `false`."
    explanation: "Not correct. That means the node does not run in a cluster."
  - id: d
    text: "`Initialized` is `false`."
    explanation: "Not correct. That means the node is not initialized."
  correct_option: a
  explanation: "Correct. The active node shows `active`."
- id: ats112-010-m03-q06
  type: single_choice
  difficulty: beginner
  learning_objective: "Predict one node failure"
  source_readings:
  - sections/section-010/module-03/course-03-losing-a-node.md
  prompt: "One node of a three-node cluster stops. What happens to requests?"
  options:
  - id: a
    text: "All requests fail until the node returns."
    explanation: "Not correct. Two of three nodes are enough."
  - id: b
    text: "Only reads work."
    explanation: "Not correct. Writes also work with a quorum."
  - id: c
    text: "The remaining nodes seal themselves."
    explanation: "Not correct. They stay unsealed."
  - id: d
    text: "They keep working, because two nodes are still a quorum."
    explanation: "Correct. If the leader stopped, an election happens first."
  correct_option: d
  explanation: "Correct. If the leader stopped, an election happens first."
- id: ats112-010-m03-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Predict two node failures"
  source_readings:
  - sections/section-010/module-03/course-03-losing-a-node.md
  prompt: "Two nodes of a three-node cluster stop. What happens to the data on the third node?"
  options:
  - id: a
    text: "The data is deleted to avoid conflicts."
    explanation: "Not correct. No data is deleted."
  - id: b
    text: "The node becomes leader and accepts writes."
    explanation: "Not correct. A write needs a quorum."
  - id: c
    text: "It stays on disk, and the node refuses requests until the quorum returns."
    explanation: "Correct. Nothing is lost."
  - id: d
    text: "The node restores a snapshot."
    explanation: "Not correct. Snapshots are only restored by an operator."
  correct_option: c
  explanation: "Correct. Nothing is lost."
- id: ats112-010-m03-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: "Remove a lost node"
  source_readings:
  - sections/section-010/module-03/course-03-losing-a-node.md
  prompt: "Which command removes a node that will never return from the Raft configuration?"
  options:
  - id: a
    text: "`bao operator raft join <address>`"
    explanation: "Not correct. It adds a node to the cluster."
  - id: b
    text: "`bao operator raft remove-peer <node-id>`"
    explanation: "Correct. The quorum is then calculated without it."
  - id: c
    text: "`bao operator step-down`"
    explanation: "Not correct. It makes the active node give up the role."
  - id: d
    text: "`bao operator seal`"
    explanation: "Not correct. It seals the node you call."
  correct_option: b
  explanation: "Correct. The quorum is then calculated without it."
- id: ats112-010-m03-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know the risk of automatic cleanup"
  source_readings:
  - sections/section-010/module-03/course-04-autopilot-and-maintenance.md
  prompt: "Why is `min-quorum` set together with `cleanup-dead-servers`?"
  options:
  - id: a
    text: "It stops Autopilot from removing nodes when that would shrink the cluster below the expected size."
    explanation: "Correct. A network split can make healthy nodes look dead."
  - id: b
    text: "It speeds up the cleanup."
    explanation: "Not correct. It only limits it."
  - id: c
    text: "It sets the number of snapshots to keep."
    explanation: "Not correct. It does not affect snapshots."
  - id: d
    text: "It chooses the leader."
    explanation: "Not correct. Elections do not use it."
  correct_option: a
  explanation: "Correct. A network split can make healthy nodes look dead."
- id: ats112-010-m03-q10
  type: single_choice
  difficulty: advanced
  learning_objective: "Order a rolling update"
  source_readings:
  - sections/section-010/module-03/course-04-autopilot-and-maintenance.md
  prompt: "In which order do you update the pods of a three-node cluster?"
  options:
  - id: a
    text: "The leader first, then the standbys."
    explanation: "Not correct. The leader would cause an election early."
  - id: b
    text: "All nodes at once."
    explanation: "Not correct. The cluster would lose its quorum."
  - id: c
    text: "Any order, because the data is replicated."
    explanation: "Not correct. The order decides how many elections happen."
  - id: d
    text: "The standby nodes first, one at a time, and the leader last after a step-down."
    explanation: "Correct. Two nodes stay running at every moment."
  correct_option: d
  explanation: "Correct. Two nodes stay running at every moment."
