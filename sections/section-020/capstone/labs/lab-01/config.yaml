# Move A Development Server To A Real Configuration
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-112-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the tester pod and OpenBao v2.7.1 (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-112-capstone-020-setup"
      description: "Installs OpenBao in development mode (in memory, already unsealed) as the starting point"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers in its pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-not-dev"
      description: "Confirms OpenBao no longer runs in development mode and stores data with Raft"
      type: "file"
      source: "validation/validate-not-dev.sh"
    - name: "validate-init-shape"
      description: "Confirms OpenBao is initialized with 3 key shares and a threshold of 2 and is unsealed"
      type: "file"
      source: "validation/validate-init-shape.sh"
    - name: "validate-config-values"
      description: "Confirms the configuration enables the UI, sets log_level to warn and sets api_addr"
      type: "file"
      source: "validation/validate-config-values.sh"
    - name: "validate-answer-token"
      description: "Confirms the token in the Secret lab-answer works and secret/platform/owner holds team=platform"
      type: "file"
      source: "validation/validate-answer-token.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
