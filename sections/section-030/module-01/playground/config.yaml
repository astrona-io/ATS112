# Initialize, Unseal And Operate OpenBao
# Astrona playground: it spins up, runs the preparation steps, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-112-playground-030-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm and the bao CLI, add the CoreDNS rewrite, start the tester pod and install OpenBao (INIT_MODE=sealed)."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
