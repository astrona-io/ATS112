# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
course_id: ATS112
exam_code: OPENBAO
status: alpha
provenance: Original practice material written for this course; not official exam
  questions.
id: ats112-010
scope:
  type: section
  id: section-010
  title: What OpenBao Is And How It Protects Data
placement:
  position: after
  reading: sections/section-010/capstone/labs/lab-01/question.md
questions:
- id: ats112-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name the parts of the server that handle a request
  source_readings:
  - sections/section-010/module-01/course-01-what-openbao-is.md
  prompt: Which part of OpenBao encrypts every value on its way to the storage backend
    and decrypts it on the way back?
  options:
  - id: a
    text: The router.
    explanation: Not correct. The router only sends the request to the mount that
      owns the path.
  - id: b
    text: The token store.
    explanation: Not correct. The token store checks that the token exists and has
      not expired.
  - id: c
    text: The barrier.
    explanation: Correct. Every read and write passes through the barrier.
  - id: d
    text: The policy check.
    explanation: Not correct. The policy check decides whether the token's policies
      allow the operation.
  correct_option: c
  explanation: Correct. Every read and write passes through the barrier.
- id: ats112-010-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Explain where OpenBao comes from
  source_readings:
  - sections/section-010/module-01/course-01-what-openbao-is.md
  prompt: How is OpenBao related to HashiCorp Vault?
  options:
  - id: a
    text: It is a fork of Vault 1.14, started by the community after the 2023 license
      change.
    explanation: Correct. That history is why many commands and API paths look like
      Vault's.
  - id: b
    text: It is the same project under a new name, with the same source repository.
    explanation: Not correct. It is a separate project that continues from a copy
      of the source code.
  - id: c
    text: It is a plugin that runs inside a Vault server.
    explanation: Not correct. OpenBao is a complete server with its own `bao` command.
  - id: d
    text: It is a newer rewrite that shares no code with Vault.
    explanation: Not correct. It started from the Vault 1.14 source code.
  correct_option: a
  explanation: Correct. That history is why many commands and API paths look like
    Vault's.
- id: ats112-010-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Read the exit code of bao status
  source_readings:
  - sections/section-010/module-01/course-01-what-openbao-is.md
  prompt: A script runs `bao status` against a sealed server. Which exit code does
    the command return?
  options:
  - id: a
    text: '0'
    explanation: Not correct. Exit code 0 means the server is unsealed.
  - id: b
    text: '1'
    explanation: Not correct. Exit code 1 means an error, such as a connection failure.
  - id: c
    text: '3'
    explanation: Not correct. The command uses only the codes 0, 1 and 2.
  - id: d
    text: '2'
    explanation: Correct. Exit code 2 means the server is sealed.
  correct_option: d
  explanation: Correct. Exit code 2 means the server is sealed.
- id: ats112-010-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Order the layers of keys
  source_readings:
  - sections/section-010/module-01/course-02-barrier-root-key-and-shamir.md
  prompt: Which key encrypts the root key?
  options:
  - id: a
    text: The encryption key in the keyring.
    explanation: Not correct. The encryption keys encrypt the data, and the root key
      encrypts the keyring.
  - id: b
    text: The unseal key.
    explanation: Correct. The unseal key protects the root key, and people hold it
      in key shares.
  - id: c
    text: The root token.
    explanation: Not correct. The root token is a credential for API requests, not
      an encryption key.
  - id: d
    text: The TLS certificate of the listener.
    explanation: Not correct. The certificate protects traffic, not the stored keys.
  correct_option: b
  explanation: Correct. The unseal key protects the root key, and people hold it in
    key shares.
- id: ats112-010-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain Shamir's secret sharing and the threshold
  source_readings:
  - sections/section-010/module-01/course-02-barrier-root-key-and-shamir.md
  prompt: A server was initialized with five key shares and a threshold of three.
    Two holders enter their shares. What is the result?
  options:
  - id: a
    text: The server stays sealed, and the two shares reveal nothing about the unseal
      key.
    explanation: Correct. Fewer shares than the threshold do not rebuild the key.
  - id: b
    text: The server unseals, because two of five is a majority of the people who
      are needed.
    explanation: Not correct. The threshold is three, so two shares are not enough.
  - id: c
    text: The server stays sealed, but the two shares make the unseal key easier to
      guess.
    explanation: Not correct. A group smaller than the threshold reveals nothing about
      the key.
  - id: d
    text: The server unseals only if the two shares are the first two shares created.
    explanation: Not correct. Any three shares work in any order, and two never work.
  correct_option: a
  explanation: Correct. Fewer shares than the threshold do not rebuild the key.
- id: ats112-010-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Tell the root key and the root token apart
  source_readings:
  - sections/section-010/module-01/course-02-barrier-root-key-and-shamir.md
  prompt: 'An administrator says: "We must protect the root key, so we will revoke
    it when the work is done." What is wrong with this statement?'
  options:
  - id: a
    text: Nothing is wrong. The root key and the root token are the same value.
    explanation: 'Not correct. They are unrelated: one encrypts the keyring, the other
      signs in a client.'
  - id: b
    text: The root key cannot be revoked because it never expires, while the root
      token can.
    explanation: Not correct. The root key is not a credential, so it has no expiry
      or revocation.
  - id: c
    text: The root key is an encryption key inside OpenBao. The root token is the
      credential that can be revoked, and the two are unrelated.
    explanation: Correct. Revoking applies to tokens, not to the root key.
  - id: d
    text: The root key is the key that every client sends in the `X-Vault-Token` header.
    explanation: Not correct. Clients send a token, and the root key never leaves
      the server.
  correct_option: c
  explanation: Correct. Revoking applies to tokens, not to the root key.
- id: ats112-010-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain auto-unseal and recovery keys
  source_readings:
  - sections/section-010/module-01/course-02-barrier-root-key-and-shamir.md
  prompt: A server uses auto-unseal with a cloud key management service. What does
    initialization return, and what can it do?
  options:
  - id: a
    text: Unseal keys, which an operator must enter after every restart.
    explanation: Not correct. Entering shares by hand is the default Shamir seal,
      not auto-unseal.
  - id: b
    text: Nothing. No keys are returned with auto-unseal.
    explanation: Not correct. Recovery keys are returned and protect sensitive operations.
  - id: c
    text: Recovery keys, which unseal the server when the cloud service is not reachable.
    explanation: Not correct. Recovery keys cannot unseal the server.
  - id: d
    text: Recovery keys, which authorize sensitive operations but cannot unseal the
      server.
    explanation: Correct. The outside service unseals the server, not the recovery
      keys.
  correct_option: d
  explanation: Correct. The outside service unseals the server, not the recovery keys.
- id: ats112-010-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Read the health endpoint
  source_readings:
  - sections/section-010/module-01/course-03-seal-states-and-health.md
  prompt: Which HTTP status code does `/v1/sys/health` return by default for a sealed
    server?
  options:
  - id: a
    text: '200'
    explanation: Not correct. 200 means initialized, unsealed and active.
  - id: b
    text: '503'
    explanation: Correct. A sealed server answers 503 on purpose.
  - id: c
    text: '429'
    explanation: Not correct. 429 means unsealed and standby.
  - id: d
    text: '501'
    explanation: Not correct. 501 means the server is not initialized.
  correct_option: b
  explanation: Correct. A sealed server answers 503 on purpose.
- id: ats112-010-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a pod is not ready
  source_readings:
  - sections/section-010/module-01/course-03-seal-states-and-health.md
  prompt: In Kubernetes the pod `openbao-0` shows `0/1` while the server is sealed.
    Why?
  options:
  - id: a
    text: The readiness probe runs `bao status` inside the pod, and that command fails
      while the server is sealed.
    explanation: Correct. The pod becomes `1/1` after the unseal.
  - id: b
    text: The readiness probe calls `/v1/sys/health` and expects 200.
    explanation: Not correct. The chart's probe runs `bao status` and does not use
      that endpoint.
  - id: c
    text: The pod cannot start until the storage volume is attached.
    explanation: Not correct. The container runs, and only the probe fails.
  - id: d
    text: Kubernetes marks every pod `0/1` until the first secret is written.
    explanation: Not correct. Readiness depends on the probe, not on the data.
  correct_option: a
  explanation: Correct. The pod becomes `1/1` after the unseal.
- id: ats112-010-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Recover from a mistaken unseal entry
  source_readings:
  - sections/section-010/module-01/course-03-seal-states-and-health.md
  prompt: You are not sure which shares you entered during an unseal. Which command
    clears the progress so you can start again?
  options:
  - id: a
    text: "`bao operator seal`"
    explanation: Not correct. That command seals an unsealed server and does not clear
      progress.
  - id: b
    text: "`bao operator init`"
    explanation: Not correct. An initialized server cannot be initialized again.
  - id: c
    text: "`bao status -reset`"
    explanation: Not correct. `bao status` only reads the seal status and has no reset
      flag.
  - id: d
    text: "`bao operator unseal -reset`"
    explanation: Correct. It throws away the shares entered so far.
  correct_option: d
  explanation: Correct. It throws away the shares entered so far.
