# The values a correct learner applies. Used only by solution/apply.sh.
fullnameOverride: openbao
injector:
  enabled: false
server:
  image:
    tag: "2.7.1"
  standalone:
    enabled: true
    config: |
      ui = true
      log_level = "debug"
      default_lease_ttl = "2h"
      max_lease_ttl = "48h"
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = true
      }
      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = true
        }
      }
      storage "raft" {
        path    = "/openbao/data"
        node_id = "openbao-0"
      }
      api_addr     = "http://openbao.localtest.me:8200"
      cluster_addr = "http://openbao-0.openbao-internal:8201"
  dataStorage:
    enabled: true
    size: 1Gi
ui:
  enabled: true
