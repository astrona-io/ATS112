      - type: reading
        title: "Initialize, Unseal And Operate OpenBao"
        path: sections/section-030/module-01/course.md
      - type: reading
        title: "Initializing A Server"
        path: sections/section-030/module-01/course-01-initializing-a-server.md
      - type: reading
