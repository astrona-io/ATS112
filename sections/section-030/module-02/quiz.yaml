# Knowledge check for module 02 of section 030. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
course_id: ATS112
exam_code: OPENBAO
status: draft
provenance: Original practice material written for this course; not official exam questions.
id: ats112-030-m02
scope:
  type: module
  id: module-02
  title: "Daily Work With The bao Command-Line Tool"
placement:
  position: after
  reading: sections/section-030/module-02/course-05-summary.md
questions:
- id: ats112-030-m02-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Point bao at a server"
  source_readings:
  - sections/section-030/module-02/course-01-command-line-conventions.md
  prompt: "Which environment variables point the `bao` command at a server and give it a token?"
  options:
  - id: a
    text: "`BAO_ADDR` and `BAO_TOKEN`"
    explanation: "Correct. The command reads both on every call."
  - id: b
    text: "`BAO_HOST` and `BAO_KEY`"
    explanation: "Not correct. Those variables do not exist."
  - id: c
    text: "`OPENBAO_URL` and `OPENBAO_LOGIN`"
    explanation: "Not correct. Those variables are not read by `bao`."
  - id: d
    text: "`BAO_SERVER` and `BAO_PASSWORD`"
    explanation: "Not correct. Those variables do not exist."
  correct_option: a
  explanation: "Correct. The command reads both on every call."
- id: ats112-030-m02-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: "Show the HTTP request of a command"
  source_readings:
  - sections/section-030/module-02/course-01-command-line-conventions.md
  prompt: "Which option prints the `curl` command that matches a `bao` command instead of running it?"
  options:
  - id: a
    text: "`-curl`"
    explanation: "Not correct. That option does not exist."
  - id: b
    text: "`-format=curl`"
    explanation: "Not correct. The format option does not take that value."
  - id: c
    text: "`-debug-http`"
    explanation: "Not correct. That option does not exist."
  - id: d
    text: "`-output-curl-string`"
    explanation: "Correct. It shows the method, path and headers."
  correct_option: d
  explanation: "Correct. It shows the method, path and headers."
- id: ats112-030-m02-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: "Find the rule a command needs"
  source_readings:
  - sections/section-030/module-02/course-01-command-line-conventions.md
  prompt: "Which option prints the policy rule a command would need, instead of running it?"
  options:
  - id: a
    text: "`-show-policy`"
    explanation: "Not correct. That option does not exist."
  - id: b
    text: "`-dry-run`"
    explanation: "Not correct. It is not a global option of `bao`."
  - id: c
    text: "`-output-policy`"
    explanation: "Correct. It helps to write a rule for the exact path."
  - id: d
    text: "`-policy`"
    explanation: "Not correct. It does not print a rule."
  correct_option: c
  explanation: "Correct. It helps to write a rule for the exact path."
- id: ats112-030-m02-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: "Use generic commands on KV version 2"
  source_readings:
  - sections/section-030/module-02/course-02-reading-and-writing-paths.md
  prompt: "You read a KV version 2 secret with `bao read`. Which path reaches the secret `inventory/db` in the engine at `secret/`?"
  options:
  - id: a
    text: "`secret/inventory/db`"
    explanation: "Not correct. That path is what `bao kv get` accepts; the generic command needs the `data/` segment."
  - id: b
    text: "`secret/data/inventory/db`"
    explanation: "Correct. KV version 2 stores values below `data/`."
  - id: c
    text: "`secret/metadata/inventory/db`"
    explanation: "Not correct. That path returns metadata, not the value."
  - id: d
    text: "`secret/db/inventory`"
    explanation: "Not correct. The folder and the name are in the wrong order."
  correct_option: b
  explanation: "Correct. KV version 2 stores values below `data/`."
- id: ats112-030-m02-q05
  type: single_choice
  difficulty: beginner
  learning_objective: "Learn a path"
  source_readings:
  - sections/section-030/module-02/course-02-reading-and-writing-paths.md
  prompt: "Which command describes what a path accepts?"
  options:
  - id: a
    text: "`bao path-help <path>`"
    explanation: "Correct. It prints the fields and operations of the path."
  - id: b
    text: "`bao describe <path>`"
    explanation: "Not correct. That command does not exist."
  - id: c
    text: "`bao list <path>`"
    explanation: "Not correct. It lists the keys below a path."
  - id: d
    text: "`bao status <path>`"
    explanation: "Not correct. `bao status` takes no path."
  correct_option: a
  explanation: "Correct. It prints the fields and operations of the path."
- id: ats112-030-m02-q06
  type: single_choice
  difficulty: beginner
  learning_objective: "Explain the default deny of policies"
  source_readings:
  - sections/section-030/module-02/course-03-tokens-and-policies.md
  prompt: "A token has a policy with one rule for `secret/data/inventory/*`. What happens on a read of `secret/data/billing/db`?"
  options:
  - id: a
    text: "It is allowed, because the token is valid."
    explanation: "Not correct. A valid token still needs a rule."
  - id: b
    text: "It is allowed with the `default` policy."
    explanation: "Not correct. The `default` policy does not grant access to secrets."
  - id: c
    text: "It returns an empty value."
    explanation: "Not correct. The request fails with a permission error."
  - id: d
    text: "It is denied with HTTP 403."
    explanation: "Correct. A path with no matching rule is denied."
  correct_option: d
  explanation: "Correct. A path with no matching rule is denied."
- id: ats112-030-m02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know which capability wins"
  source_readings:
  - sections/section-030/module-02/course-03-tokens-and-policies.md
  prompt: "A path matches two rules, and one of them has the capability `deny`. What is the result?"
  options:
  - id: a
    text: "The longer rule wins, even when it grants access."
    explanation: "Not correct. A matching `deny` still overrides."
  - id: b
    text: "The path is allowed, because one rule grants access."
    explanation: "Not correct. `deny` overrides."
  - id: c
    text: "The path is denied."
    explanation: "Correct. `deny` overrides every other capability."
  - id: d
    text: "The server refuses to load the policy."
    explanation: "Not correct. Overlapping rules are allowed."
  correct_option: c
  explanation: "Correct. `deny` overrides every other capability."
- id: ats112-030-m02-q08
  type: single_choice
  difficulty: beginner
  learning_objective: "Test a token"
  source_readings:
  - sections/section-030/module-02/course-03-tokens-and-policies.md
  prompt: "Which command shows what a given token may do on a path?"
  options:
  - id: a
    text: "`bao token show <token>`"
    explanation: "Not correct. That command does not exist."
  - id: b
    text: "`bao token capabilities <token> <path>`"
    explanation: "Correct. It prints the capabilities, such as `read`, or `deny`."
  - id: c
    text: "`bao policy test <path>`"
    explanation: "Not correct. That command does not exist."
  - id: d
    text: "`bao capabilities <path>`"
    explanation: "Not correct. The command is under `bao token`."
  correct_option: b
  explanation: "Correct. It prints the capabilities, such as `read`, or `deny`."
- id: ats112-030-m02-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know that values in audit logs are hashed"
  source_readings:
  - sections/section-030/module-02/course-04-audit-devices.md
  prompt: "How does an audit device write a secret value into its log by default?"
  options:
  - id: a
    text: "As an HMAC-SHA256 hash."
    explanation: "Correct. The same input gives the same hash, so a value can be searched for without being stored."
  - id: b
    text: "In clear text."
    explanation: "Not correct. That happens only with `log_raw=true`."
  - id: c
    text: "Encrypted with the unseal key."
    explanation: "Not correct. Values are hashed, not encrypted."
  - id: d
    text: "It is left out of the log."
    explanation: "Not correct. A hash is written in its place."
  correct_option: a
  explanation: "Correct. The same input gives the same hash, so a value can be searched for without being stored."
- id: ats112-030-m02-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know what a failing audit device does"
  source_readings:
  - sections/section-030/module-02/course-04-audit-devices.md
  prompt: "All enabled audit devices fail to write. What does the server do with new requests?"
  options:
  - id: a
    text: "It processes them and logs them later."
    explanation: "Not correct. A request must be recorded first."
  - id: b
    text: "It processes them without a record."
    explanation: "Not correct. It refuses instead."
  - id: c
    text: "It seals itself."
    explanation: "Not correct. It stays unsealed and returns errors."
  - id: d
    text: "It refuses them, so no action goes unrecorded."
    explanation: "Correct. This is why a production server should have more than one device."
  correct_option: d
  explanation: "Correct. This is why a production server should have more than one device."
