# Restore OpenBao From A Raft Snapshot
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-112-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the tester pod and OpenBao v2.7.1 (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-112-lab-010-02-setup"
      description: "Writes a secret, keeps a Raft snapshot in a Secret, then makes a bad change to the data"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the environment is ready for the reference solution"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-data-restored"
      description: "Confirms secret/inventory/db is back to version 1 with the original password"
      type: "file"
      source: "validation/validate-data-restored.sh"
    - name: "validate-later-data-gone"
      description: "Confirms the secret written after the snapshot does not exist"
      type: "file"
      source: "validation/validate-later-data-gone.sh"
    - name: "validate-same-cluster"
      description: "Confirms the cluster is the original one and was not initialized again"
      type: "file"
      source: "validation/validate-same-cluster.sh"
    - name: "validate-unsealed-ready"
      description: "Confirms the pod is Ready and OpenBao is unsealed"
      type: "file"
      source: "validation/validate-unsealed-ready.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
