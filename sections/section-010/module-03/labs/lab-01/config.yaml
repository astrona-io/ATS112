# Turn A Single OpenBao Node Into A Three-Node Cluster
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-112-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the tester pod and OpenBao v2.7.1 (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-112-lab-010-03-setup"
      description: "Writes a secret and records the cluster ID of the single node"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the environment is ready for the reference solution"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-three-voters"
      description: "Confirms the Raft configuration lists three voting nodes"
      type: "file"
      source: "validation/validate-three-voters.sh"
    - name: "validate-all-nodes-unsealed"
      description: "Confirms each of the three pods runs and is unsealed"
      type: "file"
      source: "validation/validate-all-nodes-unsealed.sh"
    - name: "validate-data-kept"
      description: "Confirms the cluster is the original one and the secret is still readable"
      type: "file"
      source: "validation/validate-data-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
