# Rotate Unseal Keys And Retire The Root Token
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-112-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the tester pod and OpenBao v2.7.1 (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-112-capstone-030-setup"
      description: "Initializes OpenBao with a single key share, writes secrets and records a baseline: the bad starting practice the task removes"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers in its pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-key-shares"
      description: "Confirms OpenBao now uses 5 key shares and a threshold of 3, on the same cluster"
      type: "file"
      source: "validation/validate-key-shares.sh"
    - name: "validate-encryption-key-rotated"
      description: "Confirms the encryption key term is higher than at the start"
      type: "file"
      source: "validation/validate-encryption-key-rotated.sh"
    - name: "validate-root-revoked"
      description: "Confirms the original root token no longer works"
      type: "file"
      source: "validation/validate-root-revoked.sh"
    - name: "validate-admin-token"
      description: "Confirms the token in the Secret lab-answer carries the admin policy, is not a root token, and can read secret/inventory/db"
      type: "file"
      source: "validation/validate-admin-token.sh"

teardown:
  keepCluster: false
