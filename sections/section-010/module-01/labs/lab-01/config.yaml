# Unseal A Server With A Key Threshold
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-112-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the tester pod and OpenBao v2.7.1 (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-112-lab-010-01-setup"
      description: "Initializes OpenBao with 5 shares and a threshold of 3, writes the secret the task reads, records a baseline and seals OpenBao again"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers in its pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-unsealed"
      description: "Confirms OpenBao is unsealed with no unseal in progress and still uses 5 shares and a threshold of 3"
      type: "file"
      source: "validation/validate-unsealed.sh"
    - name: "validate-same-barrier"
      description: "Confirms the cluster and the encryption key term are the ones the seed created, so OpenBao was not initialized again"
      type: "file"
      source: "validation/validate-same-barrier.sh"
    - name: "validate-secret-read"
      description: "Confirms secret/inventory/check holds the database password read from secret/inventory/db"
      type: "file"
      source: "validation/validate-secret-read.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
