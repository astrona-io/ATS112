        estimated_duration: 20m
        topic: cli
        task_kind: build
        tags: [operator-init, operator-unseal, root-token, kv, bao-cli, bao-addr]
        learning_goals:
          - Initialize a fresh server with five key shares and a threshold of three
          - Unseal it, sign in and enable a KV version 2 secrets engine at secret/
          - Store a first secret and read it back with the bao command-line tool
        resources:
