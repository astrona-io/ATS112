# Unseal A Server When One Key Share Is Wrong
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-112-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the tester pod and OpenBao v2.7.1 (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-112-capstone-010-setup"
      description: "Initializes OpenBao with 5 shares and a threshold of 3, corrupts one share in the Secret openbao-shares, writes the secrets and seals OpenBao"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers in its pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-unsealed"
      description: "Confirms OpenBao is unsealed with no unseal in progress and still uses 5 shares and a threshold of 3"
      type: "file"
      source: "validation/validate-unsealed.sh"
    - name: "validate-same-barrier"
      description: "Confirms the cluster and the encryption key term are the ones the seed created"
      type: "file"
      source: "validation/validate-same-barrier.sh"
    - name: "validate-bad-share-reported"
      description: "Confirms secret/ops/bad-share names the corrupted share and only that one"
      type: "file"
      source: "validation/validate-bad-share-reported.sh"
    - name: "validate-health"
      description: "Confirms /v1/sys/health answers 200 from the tester pod"
      type: "file"
      source: "validation/validate-health.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
