# Helm values for a three-node OpenBao v2.7.1 Raft cluster (chart openbao 0.30.4).
# One address everywhere: http://openbao.localtest.me:8200 (CoreDNS rewrite in
# the cluster, port-forward on the reader's machine). No TLS: lab-only.
fullnameOverride: openbao
injector:
  enabled: false
server:
  image:
    tag: "2.7.1"
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        api_addr     = "http://openbao.localtest.me:8200"
        cluster_addr = "http://$(HOSTNAME).openbao-internal:8201"

        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 1Gi
ui:
  enabled: true
